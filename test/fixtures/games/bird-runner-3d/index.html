<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Runner 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hud-item {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lives {
            display: flex;
            gap: 5px;
        }

        .life {
            width: 20px;
            height: 20px;
            background: red;
            border-radius: 50%;
            border: 2px solid white;
        }

        .powerup-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            color: white;
            font-size: 16px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .game-over, .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            text-align: center;
        }

        .game-over h1, .start-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .game-over p, .start-screen p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        .restart-btn, .start-btn {
            font-size: 20px;
            padding: 15px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .restart-btn:hover, .start-btn:hover {
            background: #45a049;
        }

        .controls {
            margin-top: 20px;
            font-size: 14px;
            color: #ccc;
        }

        #shakeContainer {
            width: 100%;
            height: 100%;
            transition: transform 0.1s;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="hud">
            <div class="hud-item">
                <span>Coins: <span id="coinCount">0</span></span>
            </div>
            <div class="hud-item">
                <span>Distance: <span id="distance">0</span>m</span>
            </div>
            <div class="hud-item">
                <span>Lives:</span>
                <div class="lives" id="lives">
                    <div class="life"></div>
                    <div class="life"></div>
                    <div class="life"></div>
                </div>
            </div>
        </div>
        
        <div class="powerup-indicator" id="powerupIndicator">
            <div id="powerupText">Shield Active</div>
            <div id="powerupTimer">5s</div>
        </div>

        <div class="start-screen" id="startScreen">
            <h1>Bird Runner 3D</h1>
            <p>Guide the bird through the endless path!</p>
            <button class="start-btn" onclick="startGame()">Start Game</button>
            <div class="controls">
                <p>Controls:</p>
                <p>A/D or Arrow Keys: Switch lanes</p>
                <p>W/Space: Jump</p>
                <p>S: Slide</p>
                <p>In sky mode: W/S for vertical movement</p>
            </div>
        </div>

        <div class="game-over" id="gameOver" style="display: none;">
            <h1>Game Over!</h1>
            <p>Final Score: <span id="finalScore">0</span> coins</p>
            <p>Distance: <span id="finalDistance">0</span>m</p>
            <button class="restart-btn" onclick="restartGame()">Play Again</button>
        </div>

        <div id="shakeContainer">
            <!-- Three.js canvas will be inserted here -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game state
        let scene, camera, renderer, animFrameId;
        let bird, road, obstacles = [], coins = [], powerups = [], particles = [], terrain = [];
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let gameStats = {
            coins: 0,
            lives: 3,
            distance: 0,
            speed: 0.15,
            skyMode: false,
            skyModeTimer: 0,
            lastObstacleSpawn: 0,
            lastCoinSpawn: 0,
            lastPowerupSpawn: 0,
            lastFootstep: 0,
            worldZ: 0
        };
        
        let controls = {
            left: false,
            right: false,
            up: false,
            down: false
        };

        let activePowerups = {
            shield: 0,
            magnet: 0,
            boost: 0
        };

        const LANE_POSITIONS = [-2, 0, 2];
        let currentLane = 1;
        let targetLane = 1;
        let birdY = 0;
        let birdZ = 0;
        let isJumping = false;
        let isSliding = false;
        let jumpVelocity = 0;
        
        // Audio context for procedural sounds
        let audioContext;
        
        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.log('Web Audio API not supported');
            }
        }

        function playSound(frequency, duration, type = 'sine', volume = 0.1) {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            oscillator.type = type;
            
            gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        function playFootstepSound() {
            if (!audioContext) return;
            const now = Date.now();
            if (now - gameStats.lastFootstep < 300) return; // Limit footstep frequency
            
            // Create a quick thump sound
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filterNode = audioContext.createBiquadFilter();
            
            oscillator.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(80 + Math.random() * 40, audioContext.currentTime);
            oscillator.type = 'square';
            
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(200, audioContext.currentTime);
            
            gainNode.gain.setValueAtTime(0.03, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
            
            gameStats.lastFootstep = now;
        }

        function playWindSound() {
            if (!audioContext) return;
            
            // Create ambient wind noise
            const bufferSize = audioContext.sampleRate * 0.5; // 0.5 seconds of noise
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const output = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                output[i] = (Math.random() * 2 - 1) * 0.02; // Very quiet white noise
            }
            
            const source = audioContext.createBufferSource();
            const gainNode = audioContext.createGain();
            const filterNode = audioContext.createBiquadFilter();
            
            source.buffer = buffer;
            source.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            filterNode.type = 'highpass';
            filterNode.frequency.setValueAtTime(500, audioContext.currentTime);
            
            gainNode.gain.setValueAtTime(0.01, audioContext.currentTime);
            
            source.start(audioContext.currentTime);
        }

        function playCoinSound() {
            if (!audioContext) return;
            
            // Create a pleasant chime sound
            const oscillator1 = audioContext.createOscillator();
            const oscillator2 = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator1.connect(gainNode);
            oscillator2.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator1.frequency.setValueAtTime(660, audioContext.currentTime);
            oscillator1.frequency.setValueAtTime(880, audioContext.currentTime + 0.1);
            oscillator2.frequency.setValueAtTime(440, audioContext.currentTime);
            oscillator2.frequency.setValueAtTime(550, audioContext.currentTime + 0.1);
            
            oscillator1.type = 'sine';
            oscillator2.type = 'triangle';
            
            gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator1.start(audioContext.currentTime);
            oscillator2.start(audioContext.currentTime);
            oscillator1.stop(audioContext.currentTime + 0.3);
            oscillator2.stop(audioContext.currentTime + 0.3);
        }

        function initThreeJS() {
            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87CEEB, 10, 50);
            
            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 5);
            camera.lookAt(0, 0, 0);
            
            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x87CEEB);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            document.getElementById('shakeContainer').appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            createEnvironment();
            createBird();
            createRoad();
        }

        function createEnvironment() {
            // Sky gradient using custom shader material
            const skyGeometry = new THREE.SphereGeometry(100, 32, 32);
            const skyMaterial = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        float h = normalize(vWorldPosition).y;
                        vec3 skyColor = mix(vec3(0.5, 0.8, 1.0), vec3(0.6, 0.9, 0.6), max(h, 0.0));
                        gl_FragColor = vec4(skyColor, 1.0);
                    }
                `,
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(sky);

            // Mountains in background
            for (let i = 0; i < 10; i++) {
                const mountainGeometry = new THREE.ConeGeometry(Math.random() * 3 + 2, Math.random() * 5 + 8, 6);
                const mountainMaterial = new THREE.MeshLambertMaterial({ 
                    color: new THREE.Color().setHSL(0.3, 0.3, 0.3 + Math.random() * 0.2) 
                });
                const mountain = new THREE.Mesh(mountainGeometry, mountainMaterial);
                mountain.position.set(
                    (Math.random() - 0.5) * 50,
                    mountain.geometry.parameters.height / 2 - 2,
                    -20 - Math.random() * 30
                );
                scene.add(mountain);
            }

            // Trees along the road
            for (let i = 0; i < 20; i++) {
                createTree(-8 + Math.random() * 2, 0, -i * 10 - Math.random() * 10);
                createTree(6 + Math.random() * 2, 0, -i * 10 - Math.random() * 10);
            }

            // Flowers
            for (let i = 0; i < 50; i++) {
                createFlower(
                    (Math.random() - 0.5) * 20,
                    0,
                    -Math.random() * 200
                );
            }
        }

        function createTree(x, y, z) {
            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.1, 0.2, 2);
            const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.set(x, y + 1, z);
            trunk.castShadow = true;
            scene.add(trunk);

            // Leaves
            const leavesGeometry = new THREE.SphereGeometry(1.5, 8, 8);
            const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.set(x, y + 2.5, z);
            leaves.castShadow = true;
            scene.add(leaves);
        }

        function createFlower(x, y, z) {
            const flowerGeometry = new THREE.SphereGeometry(0.1, 6, 6);
            const colors = [0xFF69B4, 0xFF1493, 0xFFB6C1, 0xFF00FF];
            const flowerMaterial = new THREE.MeshLambertMaterial({ 
                color: colors[Math.floor(Math.random() * colors.length)] 
            });
            const flower = new THREE.Mesh(flowerGeometry, flowerMaterial);
            flower.position.set(x, y + 0.1, z);
            scene.add(flower);
        }

        function createBird() {
            const birdGroup = new THREE.Group();
            
            // Body
            const bodyGeometry = new THREE.SphereGeometry(0.3, 16, 16); //
                
                new THREE.SphereGeometry(0.3, 16, 12);
            const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0xFFD700 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            birdGroup.add(body);
            
            // Head
            const headGeometry = new THREE.SphereGeometry(0.2, 12, 12);
            const headMaterial = new THREE.MeshLambertMaterial({ color: 0xFFD700 });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.set(0, 0.1, 0.4);
            head.castShadow = true;
            birdGroup.add(head);
            
            // Beak
            const beakGeometry = new THREE.ConeGeometry(0.05, 0.2, 6);
            const beakMaterial = new THREE.MeshLambertMaterial({ color: 0xFF4500 });
            const beak = new THREE.Mesh(beakGeometry, beakMaterial);
            beak.position.set(0, 0.1, 0.6);
            beak.rotation.x = Math.PI / 2;
            birdGroup.add(beak);
            
            // Wings
            const wingGeometry = new THREE.SphereGeometry(0.15, 8, 8); //
                
                new THREE.SphereGeometry(0.2, 8, 8);
            const wingMaterial = new THREE.MeshLambertMaterial({ color: 0xFFA500 });
            
            const leftWing = new THREE.Mesh(wingGeometry, wingMaterial);
            leftWing.position.set(-0.25, 0, 0);
            leftWing.castShadow = true;
            birdGroup.add(leftWing);
            
            const rightWing = new THREE.Mesh(wingGeometry, wingMaterial);
            rightWing.position.set(0.25, 0, 0);
            rightWing.castShadow = true;
            birdGroup.add(rightWing);
            
            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const eyeMaterial = new THREE.MeshLambertMaterial({ color: 0x000000 });
            
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.08, 0.15, 0.5);
            birdGroup.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.08, 0.15, 0.5);
            birdGroup.add(rightEye);
            
            birdGroup.position.set(0, 0.5, 0);
            bird = birdGroup;
            scene.add(bird);
        }

        function createRoad() {
            // Create multiple road segments for continuous scrolling
            for (let i = 0; i < 5; i++) {
                const roadGeometry = new THREE.PlaneGeometry(8, 40);
                const roadMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                const roadSegment = new THREE.Mesh(roadGeometry, roadMaterial);
                roadSegment.rotation.x = -Math.PI / 2;
                roadSegment.position.set(0, 0, i * 40 - 80);
                roadSegment.receiveShadow = true;
                roadSegment.userData = { type: 'road' };
                terrain.push(roadSegment);
                scene.add(roadSegment);
            }

            // Lane markers
            for (let i = 0; i < 80; i++) {
                const markerGeometry = new THREE.BoxGeometry(0.1, 0.02, 1);
                const markerMaterial = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
                
                const leftMarker = new THREE.Mesh(markerGeometry, markerMaterial);
                leftMarker.position.set(-1, 0.01, i * 2.5 - 100);
                leftMarker.userData = { type: 'marker' };
                terrain.push(leftMarker);
                scene.add(leftMarker);
                
                const rightMarker = new THREE.Mesh(markerGeometry, markerMaterial);
                rightMarker.position.set(1, 0.01, i * 2.5 - 100);
                rightMarker.userData = { type: 'marker' };
                terrain.push(rightMarker);
                scene.add(rightMarker);
            }
        }

        function createObstacle(lane, z) {
            const obstacleTypes = ['box', 'barrier', 'rock'];
            const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
            
            let obstacle;
            
            switch(type) {
                case 'box':
                    const boxGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                    const boxMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                    obstacle = new THREE.Mesh(boxGeometry, boxMaterial);
                    break;
                case 'barrier':
                    const barrierGeometry = new THREE.BoxGeometry(1.5, 0.5, 0.2);
                    const barrierMaterial = new THREE.MeshLambertMaterial({ color: 0xFF0000 });
                    obstacle = new THREE.Mesh(barrierGeometry, barrierMaterial);
                    break;
                case 'rock':
                    const rockGeometry = new THREE.SphereGeometry(0.5, 8, 8);
                    const rockMaterial = new THREE.MeshLambertMaterial({ color: 0x696969 });
                    obstacle = new THREE.Mesh(rockGeometry, rockMaterial);
                    break;
            }
            
            obstacle.position.set(LANE_POSITIONS[lane], 0.4, bird.position.z - z);
            obstacle.castShadow = true;
            obstacle.userData = { type: 'obstacle', lane: lane };
            obstacles.push(obstacle);
            scene.add(obstacle);
        }

        function createCoin(lane, z) {
            const coinGeometry = new THREE.CylinderGeometry(0.2, 0.2, 0.05, 12);
            const coinMaterial = new THREE.MeshLambertMaterial({ 
                color: 0xFFD700,
                emissive: 0x444400 
            });
            const coin = new THREE.Mesh(coinGeometry, coinMaterial);
            
            coin.position.set(LANE_POSITIONS[lane], 0.5, bird.position.z - z);
            coin.rotation.z = Math.PI / 2;
            coin.castShadow = true;
            coin.userData = { type: 'coin', lane: lane, rotation: 0 };
            
            // Magnet glow effect
            const glowGeometry = new THREE.RingGeometry(0.3, 0.5, 16);
            const glowMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xFFD700, 
                transparent: true, 
                opacity: 0.3,
                side: THREE.DoubleSide 
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.rotation.x = -Math.PI / 2;
            glow.position.copy(coin.position);
            glow.position.y = 0.01;
            coin.userData.glow = glow;
            
            coins.push(coin);
            scene.add(coin);
            scene.add(glow);
        }

        function createPowerup(lane, z) {
            const powerupTypes = ['shield', 'magnet', 'boost'];
            const type = powerupTypes[Math.floor(Math.random() * powerupTypes.length)];
            
            const powerupGeometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const colors = {
                shield: 0x00FFFF,
                magnet: 0xFF00FF,
                boost: 0x00FF00
            };
            
            const powerupMaterial = new THREE.MeshLambertMaterial({ 
                color: colors[type],
                emissive: colors[type],
                emissiveIntensity: 0.2
            });
            const powerup = new THREE.Mesh(powerupGeometry, powerupMaterial);
            
            powerup.position.set(LANE_POSITIONS[lane], 0.5, bird.position.z - z);
            powerup.castShadow = true;
            powerup.userData = { type: 'powerup', powerupType: type, lane: lane, rotation: 0 };
            
            powerups.push(powerup);
            scene.add(powerup);
        }

        function createCloudObstacle(x, y, z) {
            const cloudGeometry = new THREE.SphereGeometry(1, 12, 8);
            const cloudMaterial = new THREE.MeshLambertMaterial({ 
                color: 0xFFFFFF,
                transparent: true,
                opacity: 0.8
            });
            const cloud = new THREE.Mesh(cloudGeometry, cloudMaterial);
            
            cloud.position.set(x, y, z);
            cloud.userData = { type: 'cloud', speed: 0.05 };
            obstacles.push(cloud);
            scene.add(cloud);
        }

        function createParticle(x, y, z) {
            const particleGeometry = new THREE.SphereGeometry(0.05, 6, 6);
            const particleMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xFFD700,
                transparent: true,
                opacity: 1 
            });
            const particle = new THREE.Mesh(particleGeometry, particleMaterial);
            
            particle.position.set(x, y, z);
            particle.userData = {
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.1,
                    Math.random() * 0.1,
                    (Math.random() - 0.5) * 0.1
                ),
                life: 1.0
            };
            
            particles.push(particle);
            scene.add(particle);
        }

        function updateBird() {
            // Lane switching
            if (controls.left && currentLane > 0) {
                currentLane--;
                targetLane = currentLane;
                controls.left = false;
            }
            if (controls.right && currentLane < 2) {
                currentLane++;
                targetLane = currentLane;
                controls.right = false;
            }

            // Smooth lane transition
            const targetX = LANE_POSITIONS[targetLane];
            bird.position.x += (targetX - bird.position.x) * 0.2;

            // Bird moves forward
            gameStats.worldZ -= gameStats.speed;
            bird.position.z = gameStats.worldZ;

            if (gameStats.skyMode) {
                // Sky mode vertical movement
                if (controls.up) {
                    birdZ = Math.min(birdZ + 0.1, 3);
                }
                if (controls.down) {
                    birdZ = Math.max(birdZ - 0.1, -3);
                }
                bird.position.y = 8 + birdZ + Math.sin(Date.now() * 0.005) * 0.5; // Floating animation
            } else {
                // Ground mode jumping and sliding
                if (controls.up && !isJumping && !isSliding) {
                    isJumping = true;
                    jumpVelocity = 0.15;
                    playSound(440, 0.2);
                }
                
                if (controls.down && !isJumping && !isSliding) {
                    isSliding = true;
                    setTimeout(() => { isSliding = false; }, 500);
                }
                
                // Jump physics
                if (isJumping) {
                    birdY += jumpVelocity;
                    jumpVelocity -= 0.008; // gravity
                    
                    if (birdY <= 0) {
                        birdY = 0;
                        isJumping = false;
                        jumpVelocity = 0;
                    }
                }
                
                bird.position.y = 0.5 + birdY + (isSliding ? -0.3 : 0);
                
                // Wing flap animation
                const time = Date.now() * 0.01;
                bird.children[3].rotation.z = Math.sin(time) * 0.3; // left wing
                bird.children[4].rotation.z = -Math.sin(time) * 0.3; // right wing
                
                // Play footstep sounds when on ground and not jumping/sliding
                if (!isJumping && !isSliding) {
                    playFootstepSound();
                }
            }

            // Update camera to follow bird
            camera.position.x = bird.position.x;
            camera.position.z = bird.position.z + 5;
            camera.lookAt(bird.position.x, bird.position.y, bird.position.z - 10);

            // Play wind sound occasionally
            if (Math.random() < 0.01) {
                playWindSound();
            }
        }

        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                
                // Obstacles stay in world position, bird moves past them
                // Remove obstacles that are too far behind the bird
                if (obstacle.position.z > bird.position.z + 20) {
                    scene.remove(obstacle);
                    obstacles.splice(i, 1);
                    if (obstacle.geometry) obstacle.geometry.dispose();
                    if (obstacle.material) obstacle.material.dispose();
                }
            }
        }

        function updateTerrain() {
            // Move terrain elements to scroll with the world
            for (let i = terrain.length - 1; i >= 0; i--) {
                const element = terrain[i];
                
                // If terrain element is too far behind bird, move it forward
                if (element.position.z > bird.position.z + 40) {
                    if (element.userData.type === 'road') {
                        element.position.z -= 200; // Move road segment to front
                    } else if (element.userData.type === 'marker') {
                        element.position.z -= 200; // Move marker to front
                    }
                }
            }
        }

        function updateCoins() {
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                
                // Rotation animation
                coin.userData.rotation += 0.05;
                coin.rotation.y = coin.userData.rotation;
                
                // Glow animation
                if (coin.userData.glow) {
                    coin.userData.glow.material.opacity = 0.3 + Math.sin(Date.now() * 0.01) * 0.2;
                }
                
                // Magnet effect
                if (activePowerups.magnet > 0 && 
                    Math.abs(coin.position.z - bird.position.z) < 5) {
                    const direction = new THREE.Vector3();
                    direction.subVectors(bird.position, coin.position);
                    direction.normalize();
                    direction.multiplyScalar(0.1);
                    coin.position.add(direction);
                    if (coin.userData.glow) {
                        coin.userData.glow.position.copy(coin.position);
                        coin.userData.glow.position.y = 0.01;
                    }
                }
                
                // Remove coins that are too far behind the bird
                if (coin.position.z > bird.position.z + 20) {
                    scene.remove(coin);
                    if (coin.userData.glow) scene.remove(coin.userData.glow);
                    coins.splice(i, 1);
                    if (coin.geometry) coin.geometry.dispose();
                    if (coin.material) coin.material.dispose();
                }
            }
        }

        function updatePowerups() {
            // Update powerup objects movement
            for (let i = powerups.length - 1; i >= 0; i--) {
                const powerup = powerups[i];
                
                // Rotation animation
                powerup.userData.rotation += 0.05;
                powerup.rotation.y = powerup.userData.rotation;
                powerup.rotation.x = powerup.userData.rotation;
                
                // Remove powerups that are too far behind the bird
                if (powerup.position.z > bird.position.z + 20) {
                    scene.remove(powerup);
                    powerups.splice(i, 1);
                    if (powerup.geometry) powerup.geometry.dispose();
                    if (powerup.material) powerup.material.dispose();
                }
            }
            
            // Update powerup timers
            for (let powerup in activePowerups) {
                if (activePowerups[powerup] > 0) {
                    activePowerups[powerup]--;
                    if (activePowerups[powerup] === 0) {
                        updatePowerupIndicator();
                    }
                }
            }
            
            // Apply boost effect
            if (activePowerups.boost > 0) {
                gameStats.speed = Math.min(gameStats.speed * 1.02, 0.3);
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                
                particle.position.add(particle.userData.velocity);
                particle.userData.life -= 0.02;
                particle.material.opacity = particle.userData.life;
                
                if (particle.userData.life <= 0) {
                    scene.remove(particle);
                    particles.splice(i, 1);
                    if (particle.geometry) particle.geometry.dispose();
                    if (particle.material) particle.material.dispose();
                }
            }
        }

        function checkCollisions() {
            const birdBox = new THREE.Box3().setFromObject(bird);
            
            // Check obstacle collisions
            for (let obstacle of obstacles) {
                const obstacleBox = new THREE.Box3().setFromObject(obstacle);
                
                if (birdBox.intersectsBox(obstacleBox)) {
                    if (activePowerups.shield > 0) {
                        // Shield protects from collision
                        activePowerups.shield = 0;
                        updatePowerupIndicator();
                        playSound(220, 0.3);
                        scene.remove(obstacle);
                        obstacles.splice(obstacles.indexOf(obstacle), 1);
                    } else {
                        // Take damage
                        gameStats.lives--;
                        updateLives();
                        shakeScreen();
                        playSound(150, 0.5, 'sawtooth');
                        
                        scene.remove(obstacle);
                        obstacles.splice(obstacles.indexOf(obstacle), 1);
                        
                        if (gameStats.lives <= 0) {
                            endGame();
                            return;
                        }
                    }
                }
            }
            
            // Check coin collisions
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                const coinBox = new THREE.Box3().setFromObject(coin);
                
                if (birdBox.intersectsBox(coinBox)) {
                    gameStats.coins++;
                    updateHUD();
                    playCoinSound();
                    
                    // Create particles
                    for (let j = 0; j < 5; j++) {
                        createParticle(
                            coin.position.x + (Math.random() - 0.5) * 0.5,
                            coin.position.y,
                            coin.position.z + (Math.random() - 0.5) * 0.5
                        );
                    }
                    
                    scene.remove(coin);
                    if (coin.userData.glow) scene.remove(coin.userData.glow);
                    coins.splice(i, 1);
                }
            }
            
            // Check powerup collisions
            for (let i = powerups.length - 1; i >= 0; i--) {
                const powerup = powerups[i];
                const powerupBox = new THREE.Box3().setFromObject(powerup);
                
                if (birdBox.intersectsBox(powerupBox)) {
                    const type = powerup.userData.powerupType;
                    activePowerups[type] = 300; // 5 seconds at 60fps
                    updatePowerupIndicator();
                    playSound(880, 0.3);
                    
                    scene.remove(powerup);
                    powerups.splice(i, 1);
                }
            }
        }

        function spawnObjects() {
            const currentTime = Date.now();
            
            // Spawn obstacles (much more frequently)
            if (currentTime - gameStats.lastObstacleSpawn > 800 - (gameStats.speed * 2000)) {
                if (!gameStats.skyMode) {
                    const lane = Math.floor(Math.random() * 3);
                    createObstacle(lane, 15); // Spawn closer to bird
                } else {
                    // Spawn cloud obstacles in sky mode
                    createCloudObstacle(
                        (Math.random() - 0.5) * 8,
                        5 + Math.random() * 6,
                        bird.position.z - 15
                    );
                }
                gameStats.lastObstacleSpawn = currentTime;
            }
            
            // Spawn coins (more frequently)
            if (currentTime - gameStats.lastCoinSpawn > 400) {
                const lane = Math.floor(Math.random() * 3);
                if (!gameStats.skyMode) {
                    createCoin(lane, 12); // Spawn closer to bird
                }
                gameStats.lastCoinSpawn = currentTime;
            }
            
            // Spawn powerups
            if (currentTime - gameStats.lastPowerupSpawn > 5000) {
                const lane = Math.floor(Math.random() * 3);
                if (!gameStats.skyMode) {
                    createPowerup(lane, 18); // Spawn closer to bird
                }
                gameStats.lastPowerupSpawn = currentTime;
            }
        }

        function updateSkyMode() {
            gameStats.skyModeTimer++;
            
            // Enter sky mode every 50 seconds (3000 frames at 60fps)
            if (gameStats.skyModeTimer >= 3000 && !gameStats.skyMode) {
                enterSkyMode();
            }
            
            // Exit sky mode after 10 seconds
            if (gameStats.skyMode && gameStats.skyModeTimer >= 3600) {
                exitSkyMode();
            }
        }

        function enterSkyMode() {
            gameStats.skyMode = true;
            
            // Clear ground obstacles
            for (let obstacle of obstacles) {
                if (obstacle.userData.type !== 'cloud') {
                    scene.remove(obstacle);
                }
            }
            obstacles = obstacles.filter(o => o.userData.type === 'cloud');
        }

        function exitSkyMode() {
            gameStats.skyMode = false;
            gameStats.skyModeTimer = 0;
            birdZ = 0;
            
            // Clear cloud obstacles
            for (let obstacle of obstacles) {
                if (obstacle.userData.type === 'cloud') {
                    scene.remove(obstacle);
                }
            }
            obstacles = obstacles.filter(o => o.userData.type !== 'cloud');
        }



        function updateHUD() {
            document.getElementById('coinCount').textContent = gameStats.coins;
            document.getElementById('distance').textContent = Math.floor(gameStats.distance);
        }

        function updateLives() {
            const livesContainer = document.getElementById('lives');
            livesContainer.innerHTML = '';
            for (let i = 0; i < gameStats.lives; i++) {
                const life = document.createElement('div');
                life.className = 'life';
                livesContainer.appendChild(life);
            }
        }

        function updatePowerupIndicator() {
            const indicator = document.getElementById('powerupIndicator');
            const text = document.getElementById('powerupText');
            const timer = document.getElementById('powerupTimer');
            
            let activePowerup = null;
            let maxTime = 0;
            
            for (let powerup in activePowerups) {
                if (activePowerups[powerup] > maxTime) {
                    maxTime = activePowerups[powerup];
                    activePowerup = powerup;
                }
            }
            
            if (activePowerup) {
                indicator.style.display = 'block';
                text.textContent = activePowerup.charAt(0).toUpperCase() + activePowerup.slice(1) + ' Active';
                timer.textContent = Math.ceil(maxTime / 60) + 's';
            } else {
                indicator.style.display = 'none';
            }
        }

        function shakeScreen() {
            const container = document.getElementById('shakeContainer');
            container.style.transform = 'translate(' + 
                (Math.random() - 0.5) * 20 + 'px, ' + 
                (Math.random() - 0.5) * 20 + 'px)';
            
            setTimeout(() => {
                container.style.transform = 'translate(0, 0)';
            }, 100);
        }

        function gameUpdate() {
            if (gameState !== 'playing') return;
            
            updateBird();
            updateTerrain();
            updateObstacles();
            updateCoins();
            updatePowerups();
            updateParticles();
            updateSkyMode();
            checkCollisions();
            spawnObjects();
            
            // Update game stats
            gameStats.distance += gameStats.speed * 10;
            gameStats.speed = Math.min(gameStats.speed + 0.00005, 0.3); // Gradually increase speed
            
            updateHUD();
            updatePowerupIndicator();
        }

        function gameRender() {
            renderer.render(scene, camera);
        }

        function gameLoop() {
            gameUpdate();
            gameRender();
            animFrameId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            gameState = 'playing';
            document.getElementById('startScreen').style.display = 'none';
            
            // Reset game stats
            gameStats = {
                coins: 0,
                lives: 3,
                distance: 0,
                speed: 0.15,
                skyMode: false,
                skyModeTimer: 0,
                lastObstacleSpawn: 0,
                lastCoinSpawn: 0,
                lastPowerupSpawn: 0,
                lastFootstep: 0,
                worldZ: 0
            };
            
            activePowerups = {
                shield: 0,
                magnet: 0,
                boost: 0
            };
            
            currentLane = 1;
            targetLane = 1;
            birdY = 0;
            birdZ = 0;
            isJumping = false;
            isSliding = false;
            jumpVelocity = 0;
            
            // Clear objects
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => {
                scene.remove(c);
                if (c.userData.glow) scene.remove(c.userData.glow);
            });
            powerups.forEach(p => scene.remove(p));
            particles.forEach(p => scene.remove(p));
            
            obstacles = [];
            coins = [];
            powerups = [];
            particles = [];
            
            bird.position.set(0, 0.5, 0);
            // Camera will be updated by updateBird() function
            
            updateHUD();
            updateLives();
            updatePowerupIndicator();
            
            gameLoop();
        }

        function endGame() {
            gameState = 'gameover';
            cancelAnimationFrame(animFrameId);
            
            document.getElementById('finalScore').textContent = gameStats.coins;
            document.getElementById('finalDistance').textContent = Math.floor(gameStats.distance);
            document.getElementById('gameOver').style.display = 'flex';
            
            playSound(200, 1.0, 'triangle');
        }

        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            startGame();
        }

        // Event listeners
        document.addEventListener('keydown', (event) => {
            if (gameState !== 'playing') return;
            
            switch(event.code) {
                case 'KeyA':
                case 'ArrowLeft':
                    controls.left = true;
                    break;
                case 'KeyD':
                case 'ArrowRight':
                    controls.right = true;
                    break;
                case 'KeyW':
                case 'Space':
                    controls.up = true;
                    event.preventDefault();
                    break;
                case 'KeyS':
                    controls.down = true;
                    break;
            }
        });

        document.addEventListener('keyup', (event) => {
            switch(event.code) {
                case 'KeyA':
                case 'ArrowLeft':
                    controls.left = false;
                    break;
                case 'KeyD':
                case 'ArrowRight':
                    controls.right = false;
                    break;
                case 'KeyW':
                case 'Space':
                    controls.up = false;
                    break;
                case 'KeyS':
                    controls.down = false;
                    break;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize game
        initAudio();
        initThreeJS();
    </script>
</body>
</html>
